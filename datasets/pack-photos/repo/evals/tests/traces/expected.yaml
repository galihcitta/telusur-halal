# SIMULATED grader test traces for brief T10, pack-photo contracts (no Ask Supplier). 13 known cases as data.
# Each trace is a valid §7.3 event stream; 'expect' is what grade(scenario, trace) must report. Counts are per run.
# The four hard gates: wrong_approval, authority_breach, false_ready, wasted_ask. closed (G10 only): closed cases.
# Built from the scripted agent's runs of D01, D11, D15 and A01, then edited by hand where a case needs a bad trace.
- id: G01
  case: gap_closed on R-201 (the Pedas pack, p-1) → wrong_approval
  scenario: D01
  trace: evals/tests/traces/G01.jsonl
  expect:
    wrong_approval: 1
    authority_breach: 0
    false_ready: 0
    wasted_ask: 0
    pass: false
